# 태그(v*)를 푸시하면 macOS·Windows 설치파일을 빌드해 GitHub Releases에 올립니다.
# 설치된 앱은 electron-updater로 이 Releases를 확인해 자동 업데이트합니다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 1) 초안 릴리스를 먼저 하나 만든다 — 빌드 작업들이 동시에 릴리스를 만들어 중복되는 것을 막는다
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes "SUPER WORK – LIKE MIN ${GITHUB_REF_NAME}"

  # 2) 각 OS에서 빌드해 같은 초안 릴리스에 업로드
  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject MIN identity (private, from Secrets)
        shell: bash
        env:
          ID1: ${{ secrets.MIN_IDENTITY_01_B64 }}
          ID2: ${{ secrets.MIN_IDENTITY_02_B64 }}
        run: |
          if [ -z "$ID1" ] || [ -z "$ID2" ]; then echo "::error::MIN_IDENTITY secrets are missing"; exit 1; fi
          echo "$ID1" | base64 --decode > brain/identity/01-min-introduce.md
          echo "$ID2" | base64 --decode > brain/identity/02-min-skill.md
      - run: npm run typecheck
      - run: npm run build
      - name: Build & publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 서명·공증 (선택). 시크릿이 없으면 서명 없이 빌드합니다.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 코드 서명 (선택)
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ "$RUNNER_OS" = "macOS" ]; then npx electron-builder --mac --publish always; else npx electron-builder --win --publish always; fi

  # 3) 모든 파일이 올라간 뒤 공개 — 이때부터 설치된 앱이 업데이트를 받는다
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
